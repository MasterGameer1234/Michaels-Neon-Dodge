<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pulse Runner X</title>
<style>
body { margin:0; overflow:hidden; background:#000; font-family:Arial; color:white; }
canvas { display:block; }
#ui { position:absolute; top:20px; left:20px; }
#menu {
  position:absolute;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
}
button {
  padding:10px 20px;
  margin:10px;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>
<body>

<div id="menu">
  <h1>Pulse Runner X</h1>
  <button onclick="startGame()">Play</button>
  <button onclick="openShop()">Shop</button>
</div>

<div id="ui" style="display:none;"></div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const ui = document.getElementById("ui");
const menu = document.getElementById("menu");

let state = "menu";
let gravityDir = 1;
let gameSpeed = 6;
let score = 0;
let coins = parseInt(localStorage.getItem("coins")) || 0;
let highScore = parseInt(localStorage.getItem("highScore")) || 0;

let achievements = JSON.parse(localStorage.getItem("achievements")) || {};

const player = {
  x:150,
  y:canvas.height-200,
  size:40,
  dy:0,
  gravity:0.8,
  jump:-16,
  jumps:2,
  dashCD:0,
  slowEnergy:100,
  skin:"cyan"
};

let obstacles = [];
let particles = [];

function startGame(){
  state="play";
  menu.style.display="none";
  ui.style.display="block";
  resetGame();
}

function openShop(){
  alert("Shop coming soon: unlock skins & abilities!");
}

function resetGame(){
  gravityDir=1;
  gameSpeed=6;
  score=0;
  obstacles=[];
  particles=[];
}

function spawnObstacle(){
  const height = Math.random()*120+40;
  obstacles.push({
    x:canvas.width,
    y: gravityDir===1 ? canvas.height-height-100 : 100,
    w:40,
    h:height
  });
}
setInterval(spawnObstacle,1000);

document.addEventListener("keydown",e=>{
  if(state!=="play") return;

  if(e.code==="Space" && player.jumps>0){
    player.dy = player.jump*gravityDir;
    player.jumps--;
  }
  if(e.code==="ShiftLeft" && player.dashCD<=0){
    player.x+=150;
    player.dashCD=80;
  }
  if(e.code==="KeyG") gravityDir*=-1;
  if(e.code==="KeyE" && player.slowEnergy>0) gameSpeed=3;
});

document.addEventListener("keyup",e=>{
  if(e.code==="KeyE") gameSpeed=6;
});

canvas.addEventListener("touchstart",()=>{
  if(state==="play" && player.jumps>0){
    player.dy = player.jump*gravityDir;
    player.jumps--;
  }
});

function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(state==="play"){
    gameSpeed+=0.001;
    score++;
    coins+=0.05;

    if(gameSpeed>6 && player.slowEnergy>0) player.slowEnergy-=0.05;
    else if(player.slowEnergy<100) player.slowEnergy+=0.1;

    player.dy+=player.gravity*gravityDir;
    player.y+=player.dy;

    let ground = gravityDir===1 ? canvas.height-100 : 100;

    if((gravityDir===1 && player.y>=ground-player.size) ||
       (gravityDir===-1 && player.y<=ground)){
        player.y = gravityDir===1 ? ground-player.size : ground;
        player.dy=0;
        player.jumps=2;
    }

    if(player.dashCD>0) player.dashCD--;

    ctx.fillStyle="#222";
    ctx.fillRect(0,canvas.height-100,canvas.width,100);
    ctx.fillRect(0,0,canvas.width,100);

    particles.push({
      x:player.x,
      y:player.y+player.size/2,
      size:Math.random()*5+2,
      life:30
    });

    particles.forEach((p,i)=>{
      p.x-=2;
      p.life--;
      ctx.fillStyle=player.skin;
      ctx.globalAlpha=p.life/30;
      ctx.fillRect(p.x,p.y,p.size,p.size);
      ctx.globalAlpha=1;
      if(p.life<=0) particles.splice(i,1);
    });

    ctx.fillStyle=player.skin;
    ctx.save();
    ctx.translate(player.x+player.size/2,player.y+player.size/2);
    ctx.rotate(score*0.02);
    ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);
    ctx.restore();

    ctx.fillStyle="red";
    obstacles.forEach((o,i)=>{
      o.x-=gameSpeed;
      ctx.fillRect(o.x,o.y,o.w,o.h);

      if(player.x<o.x+o.w &&
         player.x+player.size>o.x &&
         player.y<o.y+o.h &&
         player.y+player.size>o.y){
          gameOver();
      }

      if(o.x<-50) obstacles.splice(i,1);
    });

    checkAchievements();

    ui.innerHTML=`
      Score: ${score}<br>
      High Score: ${highScore}<br>
      Coins: ${Math.floor(coins)}<br>
      Slow Energy: ${Math.floor(player.slowEnergy)}
    `;
  }

  requestAnimationFrame(update);
}

function gameOver(){
  if(score>highScore){
    highScore=score;
    localStorage.setItem("highScore",highScore);
  }
  localStorage.setItem("coins",Math.floor(coins));
  localStorage.setItem("achievements",JSON.stringify(achievements));
  state="menu";
  menu.style.display="block";
  ui.style.display="none";
}

function checkAchievements(){
  if(score>1000 && !achievements["1000"]){
    achievements["1000"]=true;
    alert("Achievement Unlocked: 1000 Score!");
  }
  if(coins>500 && !achievements["rich"]){
    achievements["rich"]=true;
    alert("Achievement Unlocked: 500 Coins!");
  }
}

update();
</script>
</body>
</html>
