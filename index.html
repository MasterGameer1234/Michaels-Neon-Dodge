<!DOCTYPE html>
<html>
<head>
<title>Orange Chaos Dash ULTRA</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

let gravity = 0.8;
let baseSpeed = 8;
let gameSpeed = baseSpeed;

let score = 0;
let level = 1;
let unlockedLevel = 1;
let maxLevel = 5;

let obstacles = [];
let portals = [];

let gameState = "menu";

let groundHeight = 80;
let ceilingHeight = 40;

let player = {
    x: 200,
    y: 0,
    size: 50,
    velocityY: 0,
    jumps: 0,
    maxJumps: 2,
    gravityDirection: 1,
    rotation: 0
};

function resetPlayer(){
    player.y = canvas.height - groundHeight - player.size;
    player.velocityY = 0;
    player.jumps = 0;
    player.gravityDirection = 1;
    player.rotation = 0;
}

canvas.addEventListener("click", ()=>{
    if(gameState !== "playing"){
        startGame();
    }
});

document.addEventListener("keydown", e=>{
    if(e.code==="Space" && player.jumps<player.maxJumps && gameState==="playing"){
        player.velocityY = -16 * player.gravityDirection;
        player.jumps++;
    }
});

function startGame(){
    obstacles = [];
    portals = [];
    score = 0;
    gravity = 0.8 + (level-1)*0.15;
    gameSpeed = baseSpeed + (level-1)*2;
    resetPlayer();
    gameState="playing";
}

// 🎯 LEVEL UNLOCK SYSTEM
function checkLevelUnlock(){
    if(score >= 100 && level < maxLevel){
        unlockedLevel = Math.max(unlockedLevel, level+1);
        level++;
        gameState = "levelup";
        setTimeout(()=>{
            startGame();
        },2000);
    }
}

// Spawn System (gets faster each level)
function spawnObstacle(){
    if(gameState==="playing"){
        let type = Math.random();
        let spawnX = canvas.width + 300;

        if(type < 0.5){
            obstacles.push({type:"spike", x:spawnX, counted:false});
        } else if(type < 0.8){
            obstacles.push({type:"block", x:spawnX, counted:false});
        } else {
            obstacles.push({type:"saw", x:spawnX, counted:false, angle:0});
        }
    }
}

function spawnPortal(){
    if(gameState==="playing"){
        portals.push({x:canvas.width + 500});
    }
}

setInterval(()=>{
    spawnObstacle();
}, 1400);

setInterval(()=>{
    spawnPortal();
}, 6000);

function update(){

    // 🌈 Animated Background
    let gradient = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    gradient.addColorStop(0, `hsl(${score*10 % 360},80%,60%)`);
    gradient.addColorStop(1, `hsl(${(score*10+180)%360},70%,30%)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(gameState==="playing"){

        gameSpeed += 0.003 + (level*0.001);

        ctx.fillStyle="#111";
        ctx.fillRect(0,canvas.height-groundHeight,canvas.width,groundHeight);
        ctx.fillRect(0,0,canvas.width,ceilingHeight);

        player.velocityY += gravity * player.gravityDirection;
        player.y += player.velocityY;

        if(player.gravityDirection===1 &&
           player.y >= canvas.height-groundHeight-player.size){
            player.y = canvas.height-groundHeight-player.size;
            player.jumps=0;
        }

        if(player.gravityDirection===-1 &&
           player.y <= ceilingHeight){
            player.y = ceilingHeight;
            player.jumps=0;
        }

        // PLAYER
        ctx.save();
        ctx.translate(player.x+player.size/2, player.y+player.size/2);
        ctx.rotate(player.rotation);
        ctx.fillStyle="orange";
        ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);
        ctx.fillStyle="red";
        ctx.fillRect(-15,-10,10,10);
        ctx.fillRect(5,-10,10,10);
        ctx.restore();

        // OBSTACLES
        obstacles.forEach(obs=>{
            obs.x -= gameSpeed;

            let baseY = player.gravityDirection===1 ?
                canvas.height-groundHeight :
                ceilingHeight;

            ctx.fillStyle="black";

            if(obs.type==="spike"){
                ctx.beginPath();
                if(player.gravityDirection===1){
                    ctx.moveTo(obs.x, baseY);
                    ctx.lineTo(obs.x+25, baseY-50);
                    ctx.lineTo(obs.x+50, baseY);
                } else {
                    ctx.moveTo(obs.x, baseY);
                    ctx.lineTo(obs.x+25, baseY+50);
                    ctx.lineTo(obs.x+50, baseY);
                }
                ctx.fill();
            }

            if(obs.type==="block"){
                ctx.fillRect(obs.x,
                    player.gravityDirection===1 ? baseY-60 : baseY,
                    60,60);
            }

            if(obs.type==="saw"){
                obs.angle+=0.2;
                ctx.save();
                ctx.translate(obs.x+30,
                    player.gravityDirection===1 ? baseY-70 : baseY+70);
                ctx.rotate(obs.angle);
                ctx.beginPath();
                for(let i=0;i<8;i++){
                    ctx.lineTo(0,30);
                    ctx.rotate(Math.PI/4);
                    ctx.lineTo(0,10);
                    ctx.rotate(Math.PI/4);
                }
                ctx.fill();
                ctx.restore();
            }

            if(!obs.counted && obs.x+60 < player.x){
                score++;
                obs.counted=true;
                checkLevelUnlock();
            }

            if(player.x < obs.x+60 &&
               player.x+player.size > obs.x){
                if(player.y+player.size > 
                   (player.gravityDirection===1 ? canvas.height-groundHeight-60 : ceilingHeight) &&
                   player.y < 
                   (player.gravityDirection===1 ? canvas.height-groundHeight : ceilingHeight+60)){
                    gameState="gameover";
                }
            }
        });

        // PORTALS
        portals.forEach((portal,i)=>{
            portal.x -= gameSpeed;

            ctx.beginPath();
            ctx.arc(portal.x+40, canvas.height/2, 40, 0, Math.PI*2);
            ctx.strokeStyle="purple";
            ctx.lineWidth=8;
            ctx.shadowBlur=25;
            ctx.shadowColor="purple";
            ctx.stroke();
            ctx.shadowBlur=0;

            if(player.x < portal.x+80 &&
               player.x+player.size > portal.x &&
               player.y < canvas.height/2+40 &&
               player.y+player.size > canvas.height/2-40){
                player.gravityDirection *= -1;
                player.rotation += Math.PI;
                portals.splice(i,1);
            }
        });

        ctx.fillStyle="white";
        ctx.font="30px Arial";
        ctx.fillText("Score: "+score,40,50);
        ctx.fillText("Level: "+level,40,90);
    }

    // MENU / GAME OVER / LEVEL UP
    if(gameState!=="playing"){
        ctx.fillStyle="rgba(0,0,0,0.6)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.font="70px Arial";

        if(gameState==="menu"){
            ctx.fillText("CLICK TO PLAY",canvas.width/2-200,canvas.height/2);
        }

        if(gameState==="gameover"){
            ctx.fillText("GAME OVER",canvas.width/2-170,canvas.height/2);
            ctx.font="40px Arial";
            ctx.fillText("Final Score: "+score,
                canvas.width/2-120,canvas.height/2+60);
        }

        if(gameState==="levelup"){
            ctx.fillText("LEVEL "+level+" UNLOCKED!",
                canvas.width/2-250,canvas.height/2);
        }
    }

    requestAnimationFrame(update);
}

resetPlayer();
update();
</script>

</body>
</html>
