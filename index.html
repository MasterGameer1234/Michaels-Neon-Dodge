<!DOCTYPE html>
<html>
<head>
<title>Orange Chaos Dash ULTRA</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ---------------- LEVEL SYSTEM ---------------- */

let currentLevel = 1;
let maxUnlockedLevel = 1;
let targetScore = 100;

let levelSettings = {
    1: { speed:8,  gravity:0.8, spawnRate:1400 },
    2: { speed:10, gravity:1.0, spawnRate:1200 },
    3: { speed:12, gravity:1.2, spawnRate:1000 },
    4: { speed:14, gravity:1.4, spawnRate:800  },
    5: { speed:17, gravity:1.7, spawnRate:600  }
};

let gravity = levelSettings[1].gravity;
let gameSpeed = levelSettings[1].speed;
let spawnRate = levelSettings[1].spawnRate;

let score = 0;
let obstacles = [];
let portals = [];
let gameState = "menu";

let groundHeight = 80;
let ceilingHeight = 40;

let player = {
    x: 200,
    y: 0,
    size: 50,
    velocityY: 0,
    jumps: 0,
    maxJumps: 2,
    gravityDirection: 1,
    rotation: 0
};

function resetPlayer(){
    player.y = canvas.height - groundHeight - player.size;
    player.velocityY = 0;
    player.jumps = 0;
    player.gravityDirection = 1;
    player.rotation = 0;
}

function applyLevelSettings(){
    gravity = levelSettings[currentLevel].gravity;
    gameSpeed = levelSettings[currentLevel].speed;
    spawnRate = levelSettings[currentLevel].spawnRate;
}

canvas.addEventListener("click", ()=>{
    if(gameState !== "playing"){
        startGame();
    }
});

document.addEventListener("keydown", e=>{
    if(e.code==="Space" && player.jumps<player.maxJumps && gameState==="playing"){
        player.velocityY = -18 * player.gravityDirection;
        player.jumps++;
    }
});

function startGame(){
    obstacles = [];
    portals = [];
    score = 0;
    applyLevelSettings();
    resetPlayer();
    gameState="playing";
}

/* ---------------- SPAWNING ---------------- */

let obstacleSpawner;
let portalSpawner;

function startSpawning(){
    clearInterval(obstacleSpawner);
    clearInterval(portalSpawner);

    obstacleSpawner = setInterval(()=>{
        if(gameState==="playing"){
            let type = Math.random();
            let spawnX = canvas.width + 300;

            if(type < 0.4){
                obstacles.push({type:"spike", x:spawnX, counted:false});
            } else if(type < 0.7){
                obstacles.push({type:"block", x:spawnX, counted:false});
            } else {
                obstacles.push({type:"saw", x:spawnX, counted:false, angle:0});
            }
        }
    }, spawnRate);

    portalSpawner = setInterval(()=>{
        if(gameState==="playing" && currentLevel>=2){
            portals.push({x:canvas.width + 500});
        }
    }, 5000);
}

/* ---------------- UPDATE ---------------- */

function update(){

    let gradient = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
    gradient.addColorStop(0, `hsl(${score*8 % 360},80%,60%)`);
    gradient.addColorStop(1, `hsl(${(score*8+180)%360},70%,30%)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if(gameState==="playing"){

        gameSpeed += 0.002;

        ctx.fillStyle="#111";
        ctx.fillRect(0,canvas.height-groundHeight,canvas.width,groundHeight);
        ctx.fillRect(0,0,canvas.width,ceilingHeight);

        player.velocityY += gravity * player.gravityDirection;
        player.y += player.velocityY;

        if(player.gravityDirection===1 &&
           player.y >= canvas.height-groundHeight-player.size){
            player.y = canvas.height-groundHeight-player.size;
            player.jumps=0;
        }

        if(player.gravityDirection===-1 &&
           player.y <= ceilingHeight){
            player.y = ceilingHeight;
            player.jumps=0;
        }

        ctx.save();
        ctx.translate(player.x+player.size/2, player.y+player.size/2);
        ctx.rotate(player.rotation);
        ctx.fillStyle="orange";
        ctx.fillRect(-player.size/2,-player.size/2,player.size,player.size);
        ctx.restore();

        obstacles.forEach(obs=>{
            obs.x -= gameSpeed;

            let baseY = player.gravityDirection===1 ?
                canvas.height-groundHeight :
                ceilingHeight;

            ctx.fillStyle="black";

            if(obs.type==="spike"){
                ctx.beginPath();
                if(player.gravityDirection===1){
                    ctx.moveTo(obs.x, baseY);
                    ctx.lineTo(obs.x+25, baseY-50);
                    ctx.lineTo(obs.x+50, baseY);
                } else {
                    ctx.moveTo(obs.x, baseY);
                    ctx.lineTo(obs.x+25, baseY+50);
                    ctx.lineTo(obs.x+50, baseY);
                }
                ctx.fill();
            }

            if(obs.type==="block"){
                ctx.fillRect(obs.x,
                    player.gravityDirection===1 ? baseY-60 : baseY,
                    60,60);
            }

            if(obs.type==="saw"){
                obs.angle+=0.3;
                ctx.save();
                ctx.translate(obs.x+30,
                    player.gravityDirection===1 ? baseY-70 : baseY+70);
                ctx.rotate(obs.angle);
                ctx.beginPath();
                for(let i=0;i<8;i++){
                    ctx.lineTo(0,30);
                    ctx.rotate(Math.PI/4);
                    ctx.lineTo(0,10);
                    ctx.rotate(Math.PI/4);
                }
                ctx.fill();
                ctx.restore();
            }

            if(!obs.counted && obs.x+60 < player.x){
                score++;
                obs.counted=true;
            }

            if(player.x < obs.x+60 &&
               player.x+player.size > obs.x){
                if(player.y+player.size >
                   (player.gravityDirection===1 ? canvas.height-groundHeight-60 : ceilingHeight) &&
                   player.y <
                   (player.gravityDirection===1 ? canvas.height-groundHeight : ceilingHeight+60)){
                    gameState="gameover";
                }
            }
        });

        portals.forEach((portal,i)=>{
            portal.x -= gameSpeed;

            ctx.beginPath();
            ctx.arc(portal.x+40, canvas.height/2, 40, 0, Math.PI*2);
            ctx.strokeStyle="purple";
            ctx.lineWidth=8;
            ctx.stroke();

            if(player.x < portal.x+80 &&
               player.x+player.size > portal.x &&
               player.y < canvas.height/2+40 &&
               player.y+player.size > canvas.height/2-40){
                player.gravityDirection *= -1;
                player.rotation += Math.PI;
                portals.splice(i,1);
            }
        });

        if(score >= targetScore){
            gameState="levelcomplete";
            if(currentLevel < 5){
                currentLevel++;
                maxUnlockedLevel = Math.max(maxUnlockedLevel, currentLevel);
            }
        }

        ctx.fillStyle="white";
        ctx.font="30px Arial";
        ctx.fillText("Level: "+currentLevel,40,40);
        ctx.fillText("Score: "+score+" / 100",40,80);
    }

    if(gameState==="menu" || gameState==="gameover" || gameState==="levelcomplete"){
        ctx.fillStyle="rgba(0,0,0,0.7)";
        ctx.fillRect(0,0,canvas.width,canvas.height);

        ctx.fillStyle="white";
        ctx.font="60px Arial";

        if(gameState==="menu"){
            ctx.fillText("CLICK TO START - LEVEL "+currentLevel,
                canvas.width/2-300,canvas.height/2);
        }

        if(gameState==="gameover"){
            ctx.fillText("GAME OVER",
                canvas.width/2-200,canvas.height/2);
            ctx.font="30px Arial";
            ctx.fillText("Click To Retry",
                canvas.width/2-100,canvas.height/2+60);
        }

        if(gameState==="levelcomplete"){
            if(currentLevel<=5){
                ctx.fillText("LEVEL COMPLETE!",
                    canvas.width/2-250,canvas.height/2);
                ctx.font="30px Arial";
                ctx.fillText("Click For Level "+currentLevel,
                    canvas.width/2-150,canvas.height/2+60);
            }
            if(currentLevel>5){
                ctx.fillText("YOU BEAT ALL 5 LEVELS!",
                    canvas.width/2-350,canvas.height/2);
            }
        }
    }

    requestAnimationFrame(update);
}

resetPlayer();
applyLevelSettings();
startSpawning();
update();

</script>

</body>
</html>
